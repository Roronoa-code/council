[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mani-council"
version = "0.1.0"
description = "Evidence-led decision councils for Codex and Claude Code, using local subscription CLIs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Council contributors"}]
dependencies = []

[project.scripts]
council = "council.cli:main"

[tool.setuptools.packages.find]
include = ["council*"]

[tool.setuptools.package-data]
council = ["skill.md", "protocol.md"]
