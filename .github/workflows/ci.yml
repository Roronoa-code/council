name: Offline reliability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: council-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install package
        run: python -m pip install .
      - name: Offline tests (no model credentials)
        run: python -m unittest discover -s tests -v
      - name: Installed-package smoke outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m council demo --depth deep --out council-ci-demo
          python -m council resume council-ci-demo
          python -m council install --target both --project council-ci-skills
      - name: Verify tracked files were not changed
        run: git diff --exit-code
